# Operating candidate; installation still requires the supervised GX hold.
packages:
  qualified_finish: !include yambms-finish-pause.yaml

esphome:
  build_path: build/reboot-timer-v4
  compile_process_limit: 2

switch:
  - id: !extend yambms1_switch_auto_ccl
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: |-
          if (!esphome::global_preferences->sync()) {
            ESP_LOGE("auto_ccl", "Could not save Auto CCL setting");
          }
  - id: !extend yambms1_switch_eoc_timer
    # EOC OFF is a supervised-session choice, not a permanent reboot policy.
    restore_mode: ALWAYS_ON

text_sensor:
  - id: !extend qualification_firmware_role
    lambda: return {"OPERATING YAMBMS - Seplos SP18B FW1.5 - 50A charge / 100A discharge - transaction reader v3 - bounded finish pause v4 reboot and diagnostic fix"};
  - platform: template
    name: Restart Policy
    device_id: qualification
    update_interval: never
    lambda: return {"AutoCCL/AutoCVL restore saved intent, default ON; EOC boots ON; saved output stops retained; fresh BMS data required"};
